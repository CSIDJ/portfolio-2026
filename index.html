<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dominique Joguin — Portfolio</title>

  <style>
    :root {
      --border: #e5e7eb;
      --text: #111827;
      --muted: #374151;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
      margin: 0;
      color: var(--text);
      background: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 40px 20px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      font-size: 34px;
    }

    .tagline {
      margin-top: 8px;
      font-weight: 600;
      color: var(--muted);
    }

    .hero {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .circles {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .circle {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 1px solid var(--border);
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #fff;
    }

    .circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .circle.logo img {
      object-fit: contain;
      padding: 36px;
      box-sizing: border-box;
    }

    nav {
      padding: 20px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    nav a {
      margin: 0 12px;
      text-decoration: none;
      font-size: 15px;
      color: #1f2937;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 14px;
      font-size: 13px;
      color: #6b7280;
      border-top: 1px solid var(--border);
    }
  </style>
</head>

<body>

  <header>
    <h1>Dominique Joguin</h1>
    <p class="tagline">
      Directeur de Programme augmenté par l’IA | Architecte Produit & Gouvernance
    </p>
  </header>

  <main class="hero">
    <div class="circles">
      <div class="circle logo">
        <img src="./assets/images/logo-dj.png" alt="Logo DJ">
      </div>

      <div class="circle">
        <img src="./assets/images/portrait.png" alt="Dominique Joguin">
      </div>
    </div>
  </main>

  <nav>
    <a href="./fr.html">🇫🇷 Français</a>
    <a href="./en.html">🇬🇧 English</a>
    <a href="./docs/CV-Joguin_D.pdf" target="_blank">📄 CV</a>
    <a href="https://www.linkedin.com/in/csidominiquejoguin/" target="_blank">💼 LinkedIn</a>
  </nav>

  <footer>
    © Dominique Joguin — 2026 | ver.21-02_10-38
  </footer>

</body>
</html>
