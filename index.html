<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dominique Joguin — Portfolio</title>


<style>
:root{
  --border:#e5e7eb;
  --text:#111827;
  --muted:#374151;
}

body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;
  margin:0;
  color:var(--text);
  background:#fff;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

header{
  padding:60px 20px 30px;
  text-align:center;
  border-bottom:1px solid var(--border);
}

h1{
  margin:0;
  font-size:34px;
}

.tagline{
  margin-top:8px;
  font-weight:600;
  color:var(--muted);
}

.portfolio-kicker{
  margin-top:10px;
  font-size:13px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#6b7280;
  font-weight:700;
}

/* HERO */
.hero{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:60px 20px;
}

/* Wrapper : masque pour arrondis (overlay + blur alignés) */
.medallion-wrapper{
  position:relative;
  display:inline-block;
  overflow:hidden;
  text-decoration:none;
  border-radius:28px; /* calé sur les contours du médaillon */
}

/* Image */
.medallion{
  width:min(720px,80vw);
  height:auto;
  display:block;
  transition:filter .45s ease, transform .45s ease;
  border-radius:28px; /* synchro visuelle */
}

/* Overlay texte */
.enter-label{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:600;
  color:#fff;
  background:rgba(17,24,39,0.35);
  opacity:0;
  transition:opacity .35s ease, transform .35s ease;
  text-align:center;
  letter-spacing:.3px;
  border-radius:28px; /* synchro visuelle */
  transform:translateY(6px); /* micro "slide up" premium */
}

/* HOVER EFFECT (desktop) */
.medallion-wrapper:hover .medallion{
  filter:grayscale(100%) blur(3px);
  transform:scale(1.015);
}

.medallion-wrapper:hover .enter-label{
  opacity:1;
  transform:translateY(0);
}

/* Mobile / touch (pas de hover) : texte visible en permanence */
@media (hover:none){
  .enter-label{
    opacity:1;
    background:rgba(17,24,39,0.25);
    font-size:18px;
    transform:none;
    backdrop-filter: blur(2px); /* option premium, fallback OK si non supporté */
  }
}

nav{
  padding:20px;
  border-top:1px solid var(--border);
  text-align:center;
}

nav a{
  margin:0 12px;
  text-decoration:none;
  font-size:15px;
  color:#1f2937;
  font-weight:500;
}

nav a:hover{
  text-decoration:underline;
}

footer{
  padding:14px;
  font-size:13px;
  color:#6b7280;
  border-top:1px solid var(--border);
}

.footer-row{
  width:min(720px,80vw);
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

@media (max-width:860px){
  .footer-row{
    flex-direction:column;
    align-items:center;
  }
}
</style>

</head>

<body>

<header>
  <h1 data-i18n="name">Dominique Joguin</h1>
  <p class="portfolio-kicker">Portfolio 2026</p>

  <p class="tagline" data-i18n="tagline_fr">
    Directeur de Programme augmenté par l’IA | Architecte Produit & Gouvernance
  </p>

  <p class="tagline" data-i18n="tagline_en">
    AI-Augmented Program Director | Product & Governance Architect
  </p>
</header>

<main class="hero">
  <a id="portfolio-link" class="medallion-wrapper" href="#">
    <img
      class="medallion"
      src="./assets/images/medallion.png?v=4"
      alt="Entrer dans le portfolio Dominique Joguin"
    />

    <span class="enter-label" data-i18n="enter_portfolio">
      Entrer dans le portfolio
    </span>
  </a>
</main>

<nav>
  <a id="nav-fr" href="./index.html?lang=fr">🇫🇷 <span data-i18n="nav_fr">Français</span></a>
  <a id="nav-en" href="./index.html?lang=en">🇬🇧 <span data-i18n="nav_en">English</span></a>
  <a id="nav-cv" href="./cv-fr.html">📄 <span data-i18n="nav_cv">CV</span></a>
  <a href="https://www.linkedin.com/in/csidominiquejoguin/" target="_blank">💼 <span data-i18n="nav_linkedin">LinkedIn</span></a>
</nav>

<footer>
  <div class="footer-row">
    <span>© Dominique Joguin 2026</span>
    <span>ver.21-02_12-15</span>
  </div>
</footer>

<script>
(function(){

const params=new URLSearchParams(window.location.search);
const forced=(params.get("lang")||"").toLowerCase();

const browserLang=(navigator.language||"en").toLowerCase();

const lang=(forced==="fr"||forced==="en")
  ?forced
  :(browserLang.startsWith("fr")?"fr":"en");

const isFR=(lang==="fr");

const t=isFR
?{
  page_title:"Dominique Joguin — Portfolio",
  nav_fr:"Français",
  nav_en:"Anglais",
  nav_cv:"CV",
  nav_linkedin:"LinkedIn",
  enter_portfolio:"Entrer dans le portfolio",
  footer_name:"Dominique Joguin"
}
:{
  page_title:"Dominique Joguin — Portfolio",
  nav_fr:"French",
  nav_en:"English",
  nav_cv:"Resume",
  nav_linkedin:"LinkedIn",
  enter_portfolio:"Enter portfolio",
  footer_name:"Dominique Joguin"
};

document.title=t.page_title;

document.querySelectorAll("[data-i18n]").forEach(el=>{
  const key=el.getAttribute("data-i18n");
  if(t[key]) el.textContent=t[key];
});

const frTag=document.querySelector('[data-i18n="tagline_fr"]');
const enTag=document.querySelector('[data-i18n="tagline_en"]');

if(frTag&&enTag){
  frTag.style.display=isFR?"":"none";
  enTag.style.display=isFR?"none":"";
}

document.documentElement.lang=isFR?"fr":"en";

/* lien dynamique */
const portfolioLink=document.getElementById("portfolio-link");
if(portfolioLink){
  portfolioLink.href=isFR?"./profile-fr.html":"./profile-en.html";
}

const cvLink=document.getElementById("nav-cv");
if(cvLink){
  cvLink.href=isFR?"./cv-fr.html":"./cv-en.html";
}

})();
</script>

</body>
</html>
