<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dominique Joguin — Portfolio</title>

  <style>
    :root {
      --border: #e5e7eb;
      --text: #111827;
      --muted: #374151;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
      margin: 0;
      color: var(--text);
      background: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 40px 20px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      font-size: 34px;
    }

    .tagline {
      margin-top: 8px;
      font-weight: 600;
      color: var(--muted);
    }

    .hero {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .circles {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .circle {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 1px solid var(--border);
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #fff;
    }

    .circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Médaillon : on veut le voir en entier */
    .circle.medallion img {
      object-fit: contain;
      padding: 0;
      box-sizing: border-box;
      background: #fff;
    }

    nav {
      padding: 20px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    nav a {
      margin: 0 12px;
      text-decoration: none;
      font-size: 15px;
      color: #1f2937;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 14px;
      font-size: 13px;
      color: #6b7280;
      border-top: 1px solid var(--border);
    }
  </style>
</head>

<body>

  <header>
    <h1 data-i18n="name">Dominique Joguin</h1>

    <!-- 2 taglines : affichage conditionnel selon langue navigateur -->
    <p class="tagline" data-i18n="tagline_fr">
      Directeur de Programme augmenté par l’IA | Architecte Produit &amp; Gouvernance
    </p>
    <p class="tagline" data-i18n="tagline_en">
      AI-Augmented Program Director | Product &amp; Governance Architect
    </p>
  </header>

  <main class="hero">
    <div class="circles">
      <!-- 1) Remplacement de l'image centrale (logo) par le médaillon -->
      <div class="circle medallion">
        <img src="./assets/images/Portfolio-médaillon.png" alt="DJ IT•AI — Dominique Joguin">
      </div>

      <div class="circle">
        <img src="./assets/images/portrait.png" alt="Dominique Joguin">
      </div>
    </div>
  </main>

  <nav>
    <!-- 2) Menus i18n selon langue navigateur -->
    <a id="nav-fr" href="./fr.html">🇫🇷 <span data-i18n="nav_fr">Français</span></a>
    <a id="nav-en" href="./en.html">🇬🇧 <span data-i18n="nav_en">English</span></a>
    <a href="./docs/CV-Joguin_D.pdf" target="_blank" rel="noopener noreferrer">📄 <span data-i18n="nav_cv">CV</span></a>
    <a href="https://www.linkedin.com/in/csidominiquejoguin/" target="_blank" rel="noopener noreferrer">💼 <span data-i18n="nav_linkedin">LinkedIn</span></a>
  </nav>

  <footer>
    © <span data-i18n="footer_name">Dominique Joguin</span> — 2026 | <span data-i18n="footer_ver">ver.21-02_11-02</span>
  </footer>

  <script>
    (function () {
      const lang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
      const isFR = lang.startsWith("fr");

      const t = isFR
        ? {
            page_title: "Dominique Joguin — Portfolio",
            name: "Dominique Joguin",
            tagline_fr: "Directeur de Programme augmenté par l’IA | Architecte Produit & Gouvernance",
            tagline_en: "AI-Augmented Program Director | Product & Governance Architect",
            nav_fr: "Français",
            nav_en: "English",
            nav_cv: "CV",
            nav_linkedin: "LinkedIn",
            footer_name: "Dominique Joguin",
            footer_ver: "ver.21-02_10-38"
          }
        : {
            page_title: "Dominique Joguin — Portfolio",
            name: "Dominique Joguin",
            tagline_fr: "Directeur de Programme augmenté par l’IA | Architecte Produit & Gouvernance",
            tagline_en: "AI-Augmented Program Director | Product & Governance Architect",
            nav_fr: "French",
            nav_en: "English",
            nav_cv: "Resume",
            nav_linkedin: "LinkedIn",
            footer_name: "Dominique Joguin",
            footer_ver: "ver.21-02_10-38"
          };

      // Titre onglet
      document.title = t.page_title;

      // Inject textes i18n
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (t[key]) el.textContent = t[key];
      });

      // Afficher la bonne tagline
      const frTag = document.querySelector('[data-i18n="tagline_fr"]');
      const enTag = document.querySelector('[data-i18n="tagline_en"]');
      if (frTag && enTag) {
        frTag.style.display = isFR ? "" : "none";
        enTag.style.display = isFR ? "none" : "";
      }

      // Option : mettre en gras la langue détectée
      const frLink = document.getElementById("nav-fr");
      const enLink = document.getElementById("nav-en");
      if (frLink && enLink) {
        (isFR ? frLink : enLink).style.fontWeight = "700";
      }

      // Met à jour l'attribut lang (utile accessibilité / SEO)
      document.documentElement.lang = isFR ? "fr" : "en";
    })();
  </script>

</body>
</html>
